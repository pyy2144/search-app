<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>资源搜索</title>
<style>
:root {
  --bg: #FFF0F3;
  --card: #FFFFFF;
  --primary: #E8A0BF;
  --primary-dark: #C86B8F;
  --primary-light: #FDE4EC;
  --text: #4A3040;
  --text-secondary: #8B6B7A;
  --text-hint: #B890A0;
  --tag-pan: #5BB5C4;
  --tag-bt: #6BA3D6;
  --border: #F5D5E0;
  --shadow: 0 2px 12px rgba(200, 107, 143, 0.10);
  --radius: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
}

.container {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding: 6vh 16px 60px;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 24px;
}

.header h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--primary-dark);
  letter-spacing: 2px;
}

.header p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* Search */
.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.search-box input {
  flex: 1;
  height: 48px;
  border: 2px solid var(--border);
  border-radius: 24px;
  padding: 0 20px;
  font-size: 16px;
  color: var(--text);
  background: var(--card);
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

.search-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(232, 160, 191, 0.2);
}

.search-box input::placeholder { color: #C8A0B0; }

.search-btn {
  height: 48px;
  padding: 0 24px;
  border: none;
  border-radius: 24px;
  background: var(--primary);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.search-btn:hover { background: var(--primary-dark); }
.search-btn:active { transform: scale(0.97); }

/* Action area */
.action-area {
  display: none;
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  text-align: center;
}

.action-area.show { display: block; }

.action-area .title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.action-area .title strong {
  color: var(--primary-dark);
}

.action-area .sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 14px;
}

.action-btns {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn-open {
  flex: 1;
  min-width: 140px;
  padding: 12px 16px;
  border: none;
  border-radius: 25px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-open:active { transform: scale(0.96); }

.btn-open.primary {
  background: var(--primary);
  color: #fff;
}

.btn-open.primary:hover { background: var(--primary-dark); }

.btn-open.secondary {
  background: var(--primary-light);
  color: var(--primary-dark);
}

.btn-open.secondary:hover { background: #F9D8E8; }

/* Section */
.section { margin-bottom: 24px; }

.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 10px;
  padding-left: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.section-title .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.dot-pan { background: var(--tag-pan); }
.dot-bt  { background: var(--tag-bt); }

/* Site cards */
.site-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

@media (max-width: 420px) {
  .site-grid { grid-template-columns: 1fr; }
  .action-btns { flex-direction: column; }
  .btn-open { min-width: auto; }
}

.site-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.3s, border-color 0.3s;
  text-decoration: none;
  color: inherit;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1.5px solid transparent;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.site-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(200, 107, 143, 0.15);
  border-color: var(--primary-light);
}

.site-card:active { transform: scale(0.97); }
.site-card.hidden { display: none; }

@keyframes pulse {
  0%, 100% { border-color: transparent; }
  50% { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(232, 160, 191, 0.2); }
}

.site-card.pulse {
  animation: pulse 0.6s ease-in-out 3;
}

.site-card .site-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.site-icon.pan { background: #E8F8FA; }
.site-icon.bt  { background: #EDF4FB; }

.site-card .site-info { flex: 1; min-width: 0; }

.site-card .site-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.site-card .site-desc {
  font-size: 11px;
  color: var(--text-hint);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.site-card .site-tag {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 8px;
  color: #fff;
  white-space: nowrap;
  flex-shrink: 0;
}

.tag-pan { background: var(--tag-pan); }
.tag-bt  { background: var(--tag-bt); }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary-dark);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.toast.show { opacity: 1; }

/* Footer */
.footer {
  text-align: center;
  margin-top: 32px;
  font-size: 12px;
  color: #C8A0B0;
  line-height: 1.8;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>资源搜索</h1>
    <p>搜索动画 / 电影 / 电视剧 / 小说</p>
  </div>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="输入资源名称..." autocomplete="off" autofocus>
    <button id="searchBtn" class="search-btn">搜索</button>
  </div>

  <div id="actionArea" class="action-area">
    <div class="title">搜 <strong id="kwDisplay"></strong></div>
    <div class="sub">点击下方任意站点卡片在新标签页打开结果</div>
    <div class="action-btns">
      <button id="btnQuickOpen" class="btn-open primary">快速搜索（推荐聚合站）</button>
      <button id="btnOpenAll" class="btn-open secondary">一键打开全部 26 个站点</button>
    </div>
  </div>

  <div id="panSection" class="section">
    <div class="section-title"><span class="dot dot-pan"></span> 网盘搜索</div>
    <div id="panGrid" class="site-grid"></div>
  </div>

  <div id="btSection" class="section">
    <div class="section-title"><span class="dot dot-bt"></span> BT / 磁力搜索</div>
    <div id="btGrid" class="site-grid"></div>
  </div>

  <div class="footer">
    点击站点卡片在新标签页打开搜索结果<br>
    站点列表来自公开整理，如有失效请联系更新
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const PAN_SITES = [
  { name: '懒盘搜索', desc: '16家搜索引擎聚合', url: 'https://lzpanx.com/?q={q}', tag: '聚合' },
  { name: '混合盘', desc: '多网盘聚合 + 时间筛选', url: 'https://hunhepan.com/?q={q}', tag: '聚合' },
  { name: '猫狸盘搜', desc: '阿里/百度/夸克/天翼/迅雷', url: 'https://alipansou.com/?q={q}', tag: '聚合' },
  { name: '易搜', desc: '全主流网盘 + 文件类型筛选', url: 'https://yiso.eu.org/?q={q}', tag: '聚合' },
  { name: '千帆搜索', desc: '阿里/百度/夸克/蓝奏/天翼/迅雷', url: 'https://niceso.net/?q={q}', tag: '聚合' },
  { name: '海搜', desc: '收录近2亿文件 50PB+', url: 'https://haisou.cc/?q={q}', tag: '海量' },
  { name: '小白盘', desc: '页面清新 失效资源少', url: 'https://www.xiaobaipan.com/search?k={q}', tag: '老牌' },
  { name: '盘友圈', desc: '影视/音乐/软件/图书全覆盖', url: 'https://panyq.com/?q={q}', tag: '综合' },
  { name: '小鹿盘搜', desc: '综合类 热门推荐', url: 'https://xiaoluso.com/?q={q}', tag: '综合' },
  { name: '竹云盘搜', desc: '主打夸克+百度', url: 'https://zhuyunso.top/?q={q}', tag: '夸克' },
  { name: '盘了个盘', desc: '7大网盘聚合 免登录', url: 'https://panlegepan.com/?q={q}', tag: '聚合' },
  { name: '皮卡搜索', desc: '五大网盘聚合', url: 'https://pikasoo.top/?q={q}', tag: '聚合' },
  { name: 'PanSearch', desc: '13条线路 阿里/百度/夸克/迅雷', url: 'https://pansearch.me/?q={q}', tag: '多线路' },
  { name: '学霸盘', desc: '百度网盘 学习资料专搜', url: 'https://xuebapan.com/?q={q}', tag: '百度' },
  { name: '阿里搜', desc: '阿里云盘专用搜索', url: 'https://aliso.eu.org/?q={q}', tag: '阿里' },
  { name: 'E书盘', desc: '电子书 PDF/EPUB/MOBI', url: 'https://eshupan.com/?q={q}', tag: '电子书' },
];

const BT_SITES = [
  { name: '磁力狗', desc: '聚合型DHT搜索引擎', url: 'https://clg.im/search?q={q}', tag: '磁力' },
  { name: '磁力云搜', desc: '影视/小说/漫画/游戏', url: 'https://ciliyunso.com/?q={q}', tag: '磁力' },
  { name: 'Knaben', desc: '匿名安全 支持TOR+RSS', url: 'https://knaben.org/?q={q}', tag: '匿名' },
  { name: '海盗湾', desc: '全球最大BT索引站', url: 'https://thepiratebay.org/search.php?q={q}', tag: '经典' },
  { name: '1337x', desc: '用户评分系统 虚假资源少', url: 'https://1337x.to/search/{q}/1/', tag: '靠谱' },
  { name: 'Torrentz2', desc: '经典BT聚合引擎', url: 'https://torrentz2.nz/search?q={q}', tag: '聚合' },
  { name: 'BT4G', desc: '元搜索聚合器 资源库巨大', url: 'https://bt4gpro.com/search?q={q}', tag: '海量' },
  { name: '动漫花园', desc: '中文动漫首选 运营超10年', url: 'https://dmhy.org/topics/list?keyword={q}', tag: '动漫' },
  { name: 'Nyaa', desc: 'ACG动漫圣地', url: 'https://nyaa.si/?q={q}', tag: '动漫' },
  { name: 'iDope', desc: '极简界面 类Google体验', url: 'https://idope.se/search/{q}/', tag: '极简' },
];

// Quick-open sites when clicking search: top 3 most popular aggregators
const QUICK_SITES = [
  { name: '懒盘搜索', url: 'https://lzpanx.com/?q={q}' },
  { name: '混合盘', url: 'https://hunhepan.com/?q={q}' },
  { name: '磁力狗', url: 'https://clg.im/search?q={q}' },
];

const $input = document.getElementById('searchInput');
const $searchBtn = document.getElementById('searchBtn');
const $actionArea = document.getElementById('actionArea');
const $kwDisplay = document.getElementById('kwDisplay');
const $btnQuick = document.getElementById('btnQuickOpen');
const $btnOpenAll = document.getElementById('btnOpenAll');
const $panGrid = document.getElementById('panGrid');
const $btGrid = document.getElementById('btGrid');
const $toast = document.getElementById('toast');

let currentKeyword = '';

renderCards(PAN_SITES, $panGrid, 'pan');
renderCards(BT_SITES, $btGrid, 'bt');

// ---- Search button: quick open top aggregator sites ----
$searchBtn.addEventListener('click', function() {
  const q = $input.value.trim();
  if (!q) {
    showToast('请输入搜索关键词');
    $input.focus();
    return;
  }
  currentKeyword = q;
  doSearch();
});

$input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    $searchBtn.click();
  }
});

// Filter cards as user types
$input.addEventListener('input', function() {
  currentKeyword = this.value.trim();
  updateCards();
  if (currentKeyword) {
    $actionArea.classList.add('show');
    $kwDisplay.textContent = currentKeyword;
  } else {
    $actionArea.classList.remove('show');
  }
});

function doSearch() {
  // Show action area
  $actionArea.classList.add('show');
  $kwDisplay.textContent = currentKeyword;

  // Open top 3 aggregator sites immediately
  const urls = QUICK_SITES.map(s => s.url.replace('{q}', encodeURIComponent(currentKeyword)));
  showToast('正在打开 ' + urls.length + ' 个聚合站搜索结果...');
  openBatch(urls);

  // Pulse the remaining cards to draw attention
  pulseAllCards();

  // Update card filtering
  updateCards();
}

function pulseAllCards() {
  document.querySelectorAll('.site-card:not(.hidden)').forEach((card, i) => {
    setTimeout(() => {
      card.classList.add('pulse');
      setTimeout(() => card.classList.remove('pulse'), 1800);
    }, i * 50);
  });
}

// Quick open button
$btnQuick.addEventListener('click', function() {
  if (!currentKeyword) return;
  const urls = QUICK_SITES.map(s => s.url.replace('{q}', encodeURIComponent(currentKeyword)));
  showToast('正在打开 ' + urls.length + ' 个聚合站搜索结果...');
  openBatch(urls);
});

// Open all button
$btnOpenAll.addEventListener('click', function() {
  if (!currentKeyword) return;
  const allSites = [...PAN_SITES, ...BT_SITES];
  const urls = allSites.map(s => s.url.replace('{q}', encodeURIComponent(currentKeyword)));
  showToast('正在打开全部 ' + urls.length + ' 个站点...');
  openBatch(urls);
});

function openBatch(urls) {
  urls.forEach((url, i) => {
    setTimeout(() => window.open(url, '_blank', 'noopener'), i * 250);
  });
}

function renderCards(sites, container, type) {
  container.innerHTML = sites.map(s => {
    const iconEmoji = s.desc.includes('动漫') ? '🎬' :
                      s.desc.includes('电子书') || s.desc.includes('学习') ? '📚' :
                      s.desc.includes('小说') ? '📖' :
                      s.desc.includes('音乐') ? '🎵' :
                      type === 'pan' ? '☁️' : '🧲';
    return `<a class="site-card" data-keywords="${escAttr(s.name + ' ' + s.desc + ' ' + s.tag)}"
          href="#" data-url="${escAttr(s.url)}" target="_blank" rel="noopener">
      <div class="site-icon ${type}">${iconEmoji}</div>
      <div class="site-info">
        <div class="site-name">${escHtml(s.name)}</div>
        <div class="site-desc">${escHtml(s.desc)}</div>
      </div>
      <span class="site-tag tag-${type}">${escHtml(s.tag)}</span>
    </a>`;
  }).join('');

  container.querySelectorAll('.site-card').forEach(card => {
    card.addEventListener('click', function(e) {
      e.preventDefault();
      if (!currentKeyword) {
        showToast('请先输入搜索关键词');
        $input.focus();
        return;
      }
      const url = buildUrl(this.dataset.url, currentKeyword);
      if (url) {
        window.open(url, '_blank', 'noopener');
      }
    });
  });
}

function updateCards() {
  const q = currentKeyword.toLowerCase();
  let panV = 0, btV = 0;

  document.querySelectorAll('#panGrid .site-card').forEach(c => {
    const m = !q || c.dataset.keywords.toLowerCase().includes(q);
    c.classList.toggle('hidden', !m);
    if (m) panV++;
  });
  document.querySelectorAll('#btGrid .site-card').forEach(c => {
    const m = !q || c.dataset.keywords.toLowerCase().includes(q);
    c.classList.toggle('hidden', !m);
    if (m) btV++;
  });

  if (q && panV === 0 && btV === 0) {
    document.querySelectorAll('#panGrid .site-card').forEach(c => c.classList.remove('hidden'));
    document.querySelectorAll('#btGrid .site-card').forEach(c => c.classList.remove('hidden'));
    panV = PAN_SITES.length;
    btV = BT_SITES.length;
  }

  document.getElementById('panSection').style.display = (q && panV === 0) ? 'none' : '';
  document.getElementById('btSection').style.display = (q && btV === 0) ? 'none' : '';
}

function buildUrl(template, keyword) {
  return template.replace('{q}', encodeURIComponent(keyword));
}

function showToast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout($toast._timeout);
  $toast._timeout = setTimeout(() => $toast.classList.remove('show'), 2500);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
